name: Chat SDK adapter
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that every action is pinned to a commit SHA
        shell: bash
        run: |
          files=$(find .github/workflows .github/actions -name '*.yml' -o -name '*.yaml' 2>/dev/null || true)
          [ -n "$files" ] || { echo "No workflow files found."; exit 1; }
          # Local actions (./path) need no pin.
          unpinned=$(grep -HnE '^[[:space:]-]*uses:' $files | tr -d '\r' \
            | grep -vE "uses:[[:space:]]*[\"']?(\./|[^@[:space:]\"']+@[0-9a-fA-F]{40}[\"']?([[:space:]]|$))" || true)
          if [ -n "$unpinned" ]; then
            echo "$unpinned"
            echo "Pin each action above to a full commit SHA."
            exit 1
          fi
      # pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # No dependency lifecycle scripts.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter example-hail-chat-sdk typecheck
      - run: pnpm --filter example-hail-chat-sdk build
        env:
          HAIL_FROM_NUMBER: "+14155550100"
          REDIS_URL: redis://localhost:6379
      - run: npm pack --dry-run --ignore-scripts
