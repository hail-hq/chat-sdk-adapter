name: Chat SDK adapter
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter example-hail-chat-sdk typecheck
      - run: pnpm --filter example-hail-chat-sdk build
        env:
          HAIL_FROM_NUMBER: "+14155550100"
          REDIS_URL: redis://localhost:6379
      - run: npm pack --dry-run --ignore-scripts
